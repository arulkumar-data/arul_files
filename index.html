<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure File Vault</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b1320;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .vault-card {
      background-color: #162238;
      border: 1px solid #22324f;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .icon-lock {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sub-text {
      color: #8b9bb4;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .prompt-text {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1a6cf0;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background-color: #1557c0;
    }

    .section-panel {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #22324f;
      text-align: left;
    }

    /* Password Input Wrapper */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      background-color: #0d1726;
      border: 1px solid #2a3b5c;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .password-wrapper .input-box {
      padding-right: 42px;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #8b9bb4;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .toggle-pass-btn:hover {
      color: #ffffff;
    }

    .file-input {
      margin-bottom: 12px;
    }

    .input-box:focus {
      border-color: #1a6cf0;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .file-list {
      list-style: none;
      margin-top: 15px;
      max-height: 220px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #0d1726;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .file-item a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .file-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="vault-card">
    <div class="icon-lock">🔐</div>
    <h1>Secure File Vault</h1>
    <p class="sub-text">Private • Secure • Simple</p>
    <p class="prompt-text">What do you want to do?</p>

    <div class="btn-group">
      <button class="btn" id="btn-show-upload">📥 Upload (Add files)</button>
      <button class="btn" id="btn-show-download">📤 Download (Access files)</button>
    </div>

    <!-- Upload Box -->
    <div id="upload-panel" class="section-panel">
      <h3 style="margin-bottom: 12px; font-size: 15px;">Upload Files</h3>
      <div class="password-wrapper">
        <input type="password" id="upload-pass" class="input-box" placeholder="Enter Upload Password" />
        <button type="button" class="toggle-pass-btn" onclick="togglePassword('upload-pass', this)" title="Show/Hide Password">👁️</button>
      </div>
      <input type="file" id="file-uploader" class="input-box file-input" />
      <button class="btn" id="btn-submit-upload" style="width: 100%; justify-content: center;">Upload Now</button>
      <div id="upload-status" class="status-msg"></div>
    </div>

    <!-- Download Box -->
    <div id="download-panel" class="section-panel">
      <h3 style="margin-bottom: 12px; font-size: 15px;">Access Files</h3>
      <div class="password-wrapper">
        <input type="password" id="download-pass" class="input-box" placeholder="Enter Download Password" />
        <button type="button" class="toggle-pass-btn" onclick="togglePassword('download-pass', this)" title="Show/Hide Password">👁️</button>
      </div>
      <button class="btn" id="btn-submit-download" style="width: 100%; justify-content: center;">Unlock & View Files</button>
      <div id="download-status" class="status-msg"></div>
      <ul id="files-container" class="file-list"></ul>
    </div>
  </div>

  <script>
    // 1. Password Config
    const UPLOAD_PASSWORD = "myupload";
    const DOWNLOAD_PASSWORD = "mydownload";

    // 2. Supabase Credentials
    const SUPABASE_URL = "https://dtrvsjgfnnvtsbzvdbax.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0cnZzamdmbm52dHNienZkYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDY2NDAsImV4cCI6MjEwNDQyMjY0MH0.9L379syDIznzM6cQUl6x_Z5Pd3JLCMA4LwJfZvR9mw4";
    const BUCKET_NAME = "vault";

    // Initialize Supabase Client
    let client = null;
    try {
      if (window.supabase) {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error("Supabase init error:", e);
    }

    // Toggle Password Visibility Function
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.innerText = "🙈";
      } else {
        input.type = "password";
        btn.innerText = "👁️";
      }
    }

    // Panel Toggle Logic
    const uploadPanel = document.getElementById("upload-panel");
    const downloadPanel = document.getElementById("download-panel");

    document.getElementById("btn-show-upload").addEventListener("click", () => {
      uploadPanel.style.display = "block";
      downloadPanel.style.display = "none";
    });

    document.getElementById("btn-show-download").addEventListener("click", () => {
      downloadPanel.style.display = "block";
      uploadPanel.style.display = "none";
    });

    // Handle Upload
    document.getElementById("btn-submit-upload").addEventListener("click", async () => {
      const pass = document.getElementById("upload-pass").value;
      const fileInput = document.getElementById("file-uploader");
      const status = document.getElementById("upload-status");

      if (pass !== UPLOAD_PASSWORD) {
        status.style.color = "#ff5555";
        status.innerText = "❌ Incorrect Upload Password!";
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        status.style.color = "#facc15";
        status.innerText = "⚠️ Please choose a file first!";
        return;
      }

      if (!client) {
        status.style.color = "#ff5555";
        status.innerText = "Supabase connection error. Check credentials.";
        return;
      }

      const file = fileInput.files[0];
      const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;

      status.style.color = "#38bdf8";
      status.innerText = "Uploading... please wait.";

      try {
        const { data, error } = await client.storage
          .from(BUCKET_NAME)
          .upload(safeName, file);

        if (error) {
          status.style.color = "#ff5555";
          status.innerText = "Upload failed: " + error.message;
        } else {
          status.style.color = "#4ade80";
          status.innerText = "✅ Upload successful!";
          fileInput.value = "";
          document.getElementById("upload-pass").value = "";
        }
      } catch (err) {
        status.style.color = "#ff5555";
        status.innerText = "Error: " + err.message;
      }
    });

    // Handle Download List
    document.getElementById("btn-submit-download").addEventListener("click", async () => {
      const pass = document.getElementById("download-pass").value;
      const status = document.getElementById("download-status");
      const listContainer = document.getElementById("files-container");

      listContainer.innerHTML = "";

      if (pass !== DOWNLOAD_PASSWORD) {
        status.style.color = "#ff5555";
        status.innerText = "❌ Incorrect Download Password!";
        return;
      }

      if (!client) {
        status.style.color = "#ff5555";
        status.innerText = "Supabase connection error. Check credentials.";
        return;
      }

      status.style.color = "#38bdf8";
      status.innerText = "Fetching files...";

      try {
        const { data, error } = await client.storage.from(BUCKET_NAME).list();

        if (error) {
          status.style.color = "#ff5555";
          status.innerText = "Error: " + error.message;
          return;
        }

        const validFiles = (data || []).filter(f => f.name !== ".emptyFolderPlaceholder");

        if (validFiles.length === 0) {
          status.style.color = "#facc15";
          status.innerText = "Vault is empty.";
          return;
        }

        status.innerText = "";
        validFiles.forEach(file => {
          const { data: publicUrlData } = client.storage
            .from(BUCKET_NAME)
            .getPublicUrl(file.name);

          const li = document.createElement("li");
          li.className = "file-item";
          li.innerHTML = `
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px;">📄 ${file.name}</span>
            <a href="${publicUrlData.publicUrl}" target="_blank" download>Download</a>
          `;
          listContainer.appendChild(li);
        });
      } catch (err) {
        status.style.color = "#ff5555";
        status.innerText = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
